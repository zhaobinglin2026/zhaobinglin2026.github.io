<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}zh-CN{% endif %}" 
      class="no-js"
      data-layout="{{ page.layout }}"
      {% if page.url contains '/en/' %}lang="en"{% endif %}>
{% include head.html %}
<body class="song-theme layout-{{ page.layout }} {% if page.url contains '/en/' %}lang-en{% endif %}">

  <!-- 顶部导航 -->
  {% include navigation.html %}

  <!-- 主内容区：宋式美学的"纸面" -->
  <main class="page-main" role="main" id="main">
    {{ content }}
  </main>

  <!-- 通用页脚 -->
  {% include footer.html %}

  <!-- 底部脚本 -->
  {% include scripts.html %}

</body>
</html>
