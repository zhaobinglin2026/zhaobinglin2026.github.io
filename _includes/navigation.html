<!-- ========================================== -->
<!-- 宋式导航：顶部横栏 · 鱼尾 · 明式弧线         -->
<!-- ========================================== -->
<header class="site-nav" role="banner">
  <div class="nav-container">
    
    <!-- 品牌：姓名 -->
    <a href="{{ '/' | relative_url }}" class="nav-brand" aria-label="首页">
      {{ site.title | default: "赵冰琳" }}
    </a>

    <!-- 导航链接 -->
    <nav class="nav-menu" role="navigation" aria-label="主导航">
      <ul class="nav-links">
        <li class="nav-item">
          <a href="{{ '/' | relative_url }}" 
             class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
            首页
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ '/projects/' | relative_url }}" 
             class="nav-link {% if page.url == '/projects/' or page.url == '/projects.html' %}active{% endif %}">
            项目
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ '/blogs/' | relative_url }}" 
             class="nav-link {% if page.url == '/blogs/' or page.url == '/blogs.html' %}active{% endif %}">
            博文
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ '/experiences/' | relative_url }}" 
             class="nav-link {% if page.url == '/experiences/' or page.url == '/experiences.html' %}active{% endif %}">
            经历
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ '/CV/' | relative_url }}" 
             class="nav-link {% if page.url == '/CV/' or page.url == '/CV.html' %}active{% endif %}">
            履历
          </a>
        </li>
        <li class="nav-item nav-item-lang">
          <a href="{{ '/en/' | relative_url }}" 
             class="nav-link {% if page.url contains '/en/' %}active{% endif %}"
             aria-label="English version">
            EN
          </a>
        </li>
      </ul>
    </nav>

    <!-- 深色模式切换：昼 / 夜 -->
    <button type="button" 
            class="theme-toggle" 
            onclick="window.toggleTheme()" 
            aria-label="切换明暗模式"
            title="切换明暗模式">
      <span class="toggle-day" aria-hidden="true">昼</span>
      <span class="toggle-night" aria-hidden="true">夜</span>
    </button>

  </div>
</header>

<!-- 导航补充样式：主题切换与移动端微调 -->
<style>
  /* 主题切换按钮：印章式极简 */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin-left: 1.5rem;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--font-serif-sc), serif;
    font-size: 0.875rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    color: var(--accent);
    border-color: var(--frame);
    transform: translateY(-1px);
  }

  /* 通过 data-theme 控制昼/夜显示，无需额外 JS */
  html:not([data-theme="dark"]) .toggle-night {
    display: none;
  }
  html[data-theme="dark"] .toggle-day {
    display: none;
  }

  /* 移动端导航微调 */
  @media (max-width: 767px) {
    .nav-container {
      padding-left: 1rem;
      padding-right: 1rem;
    }
    
    .nav-links {
      gap: 1.25rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
      padding-right: 0.5rem;
    }
    
    .nav-links::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    
    .nav-link {
      font-size: 0.875rem;
      white-space: nowrap;
    }
    
    .theme-toggle {
      margin-left: 0.75rem;
    }
  }

  /* 英文导航项略缩间距 */
  .nav-item-lang .nav-link {
    font-family: var(--font-serif-en), var(--font-serif-sc), serif;
    letter-spacing: 0.04em;
  }
</style>
